<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Backlog Summary - Ang Thong AABM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="libs/sheetjs/xlsx.full.min.js"></script>
    <style>
        :root {
            --ink-950: #0f172a;
            --ink-900: #111827;
            --ink-800: #1f2937;
            --line: rgba(148, 163, 184, 0.22);
            --backlog-bg: rgba(255, 237, 213, 0.78);
            --backlog-bg-strong: rgba(255, 224, 178, 0.92);
            --backlog-ink: #9a3412;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(245, 158, 11, 0.11), transparent 34%),
                radial-gradient(circle at top right, rgba(14, 165, 233, 0.12), transparent 26%),
                linear-gradient(180deg, #fcfcfb 0%, #f5f7fb 45%, #eef2f8 100%);
            color: var(--ink-900);
        }

        .display-font {
            font-family: 'Chakra Petch', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 18px 45px -24px rgba(15, 23, 42, 0.28);
        }

        .mesh-strip {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.76)),
                linear-gradient(120deg, rgba(245, 158, 11, 0.18), rgba(14, 165, 233, 0.12), rgba(15, 118, 110, 0.16));
        }

        .summary-table {
            border-collapse: separate;
            border-spacing: 0;
            min-width: var(--table-min-width, 1480px);
            width: max(100%, var(--table-min-width, 1480px));
            font-size: var(--table-font-size, 0.95rem);
        }

        .summary-table th,
        .summary-table td {
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: var(--table-cell-y, 0.72rem) var(--table-cell-x, 0.78rem);
            text-align: center;
            white-space: nowrap;
        }

        .summary-table thead th {
            color: var(--ink-800);
            font-weight: 700;
        }

        .summary-table thead tr:first-child th {
            border-top: 1px solid var(--line);
        }

        .summary-table tr>*:first-child {
            border-left: 1px solid var(--line);
        }

        .summary-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.86);
        }

        .summary-table .month-cell {
            text-align: left;
            font-weight: 700;
            color: var(--ink-800);
        }

        .summary-table .future-row {
            background: rgba(241, 245, 249, 0.55);
            color: #64748b;
        }

        .summary-table .total-row {
            background: linear-gradient(180deg, rgba(255, 247, 237, 0.96), rgba(255, 255, 255, 0.94));
            font-weight: 700;
        }

        .summary-table .table-title-row th {
            background: rgba(255, 255, 255, 0.98);
            text-align: left;
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--ink-900);
        }

        .summary-table .carry-head,
        .summary-table .carry-base {
            background: rgba(250, 204, 21, 0.82);
            color: #713f12;
            font-weight: 700;
        }

        .summary-table .group-head {
            background: rgba(191, 219, 254, 0.82);
            color: #1d4ed8;
        }

        .summary-table .subhead {
            background: rgba(219, 234, 254, 0.82);
            color: #1e3a8a;
        }

        .summary-table .backlog-head {
            background: linear-gradient(180deg, rgba(255, 244, 230, 0.98), rgba(255, 249, 240, 0.92));
            color: var(--backlog-ink);
        }

        .summary-table tbody td:nth-child(5),
        .summary-table tbody td:nth-child(6),
        .summary-table tbody td:nth-child(13),
        .summary-table tbody td:nth-child(14),
        .summary-table tbody td:nth-child(18),
        .summary-table tbody td:nth-child(19) {
            background: var(--backlog-bg);
            color: var(--backlog-ink);
            font-weight: 600;
        }

        .summary-table tbody tr.future-row td:nth-child(5),
        .summary-table tbody tr.future-row td:nth-child(6),
        .summary-table tbody tr.future-row td:nth-child(13),
        .summary-table tbody tr.future-row td:nth-child(14),
        .summary-table tbody tr.future-row td:nth-child(18),
        .summary-table tbody tr.future-row td:nth-child(19) {
            background: rgba(255, 241, 224, 0.86);
            color: #b45309;
        }

        .summary-table tbody tr.total-row td:nth-child(5),
        .summary-table tbody tr.total-row td:nth-child(6),
        .summary-table tbody tr.total-row td:nth-child(13),
        .summary-table tbody tr.total-row td:nth-child(14),
        .summary-table tbody tr.total-row td:nth-child(18),
        .summary-table tbody tr.total-row td:nth-child(19) {
            background: var(--backlog-bg-strong);
            color: #7c2d12;
        }

        .table-shell {
            --table-min-width: 1480px;
            --table-font-size: 0.95rem;
            --table-cell-x: 0.78rem;
            --table-cell-y: 0.72rem;
            overflow-x: auto;
            border-radius: 1.5rem;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
        }

        .table-shell::-webkit-scrollbar {
            height: 10px;
        }

        .table-shell::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.72), rgba(15, 118, 110, 0.72));
            border-radius: 999px;
        }

        #report-sections.zoom-compact .table-shell {
            --table-min-width: 1360px;
            --table-font-size: 0.86rem;
            --table-cell-x: 0.6rem;
            --table-cell-y: 0.58rem;
        }

        #report-sections.zoom-normal .table-shell {
            --table-min-width: 1480px;
            --table-font-size: 0.95rem;
            --table-cell-x: 0.78rem;
            --table-cell-y: 0.72rem;
        }

        #report-sections.zoom-expanded .table-shell {
            --table-min-width: 1620px;
            --table-font-size: 1rem;
            --table-cell-x: 0.9rem;
            --table-cell-y: 0.82rem;
        }

        .zoom-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .shimmer {
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, rgba(226, 232, 240, 0.9), rgba(241, 245, 249, 1), rgba(226, 232, 240, 0.9));
            background-size: 200% 100%;
            animation: shimmer 1.6s linear infinite;
        }

        @keyframes shimmer {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: #fff;
            }

            .glass-panel {
                box-shadow: none;
                border: 1px solid #dbe1eb;
                background: #fff;
            }
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-20 left-[-8%] h-72 w-72 rounded-full bg-amber-300/25 blur-3xl"></div>
        <div class="absolute top-24 right-[-6%] h-80 w-80 rounded-full bg-sky-300/20 blur-3xl"></div>
        <div class="absolute bottom-0 left-1/3 h-64 w-64 rounded-full bg-teal-300/20 blur-3xl"></div>
    </div>

    <main class="relative z-10 px-4 py-6 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-[1700px] space-y-6">
            <header class="glass-panel rounded-[2rem] p-5 sm:p-7">
                <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
                    <div class="max-w-3xl">
                        <div
                            class="mb-4 inline-flex items-center gap-2 rounded-full border border-slate-200/80 bg-white/70 px-3 py-1 text-xs font-semibold uppercase tracking-[0.25em] text-slate-500">
                            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
                            Admin Only Report
                        </div>
                        <h1 class="display-font text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
                            สรุปงานค้างแบบผู้ตรวจ</h1>
                        <p class="mt-3 max-w-2xl text-sm leading-7 text-slate-600 sm:text-base">
                            งานค้างทั้งหมดของแต่ละฝ่าย

                        </p>
                    </div>

                    <div class="no-print flex flex-wrap gap-3">
                        <a href="index.html"
                            class="inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white/85 px-4 py-3 text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-slate-300 hover:text-slate-900">
                            <i class="fas fa-arrow-left"></i>
                            กลับหน้าหลัก
                        </a>
                        <button id="btn-export-excel"
                            class="inline-flex items-center gap-2 rounded-2xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-slate-900/15 transition hover:-translate-y-0.5 hover:bg-slate-800">
                            <i class="fas fa-file-excel"></i>
                            Export Excel
                        </button>
                    </div>
                </div>
            </header>

            <section class="glass-panel mesh-strip rounded-[2rem] p-5 sm:p-6 no-print">
                <div class="flex flex-col gap-5 xl:flex-row xl:items-end xl:justify-between">
                    <div class="space-y-2">
                        <h2 class="display-font text-2xl font-semibold text-slate-900">ตั้งค่ารายงาน</h2>
                        <p class="text-sm text-slate-600">เลือกปีงบและเดือนสุดท้ายที่ต้องการให้ระบบคำนวณสะสม</p>
                    </div>

                    <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-5">
                        <label class="rounded-2xl border border-white/70 bg-white/80 p-3 shadow-sm">
                            <span
                                class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">ปีรายงาน</span>
                            <select id="report-year"
                                class="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-semibold text-slate-800 outline-none transition focus:border-teal-500"></select>
                        </label>

                        <label class="rounded-2xl border border-white/70 bg-white/80 p-3 shadow-sm">
                            <span
                                class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">คำนวณถึงเดือน</span>
                            <select id="report-end-month"
                                class="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-semibold text-slate-800 outline-none transition focus:border-teal-500"></select>
                        </label>

                        <div class="rounded-2xl border border-white/70 bg-white/80 p-3 shadow-sm">
                            <span
                                class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Baseline</span>
                            <p id="baseline-label" class="pt-3 text-sm font-semibold text-slate-800">-</p>
                        </div>

                        <div class="rounded-2xl border border-white/70 bg-white/80 p-3 shadow-sm">
                            <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">ขนาดตาราง</span>
                            <div class="flex items-center gap-2">
                                <button id="btn-zoom-out" type="button"
                                    class="zoom-button inline-flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition hover:-translate-y-0.5 hover:border-orange-300 hover:text-orange-700">
                                    <i class="fas fa-magnifying-glass-minus"></i>
                                </button>
                                <div id="table-zoom-label"
                                    class="flex-1 rounded-xl bg-slate-100 px-3 py-3 text-center text-sm font-semibold text-slate-700">90%</div>
                                <button id="btn-zoom-in" type="button"
                                    class="zoom-button inline-flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition hover:-translate-y-0.5 hover:border-teal-300 hover:text-teal-700">
                                    <i class="fas fa-magnifying-glass-plus"></i>
                                </button>
                            </div>
                        </div>

                        <button id="btn-refresh"
                            class="inline-flex items-center justify-center gap-2 rounded-2xl bg-teal-700 px-5 py-4 text-sm font-semibold text-white shadow-lg shadow-teal-700/20 transition hover:-translate-y-0.5 hover:bg-teal-600">
                            <i class="fas fa-rotate-right"></i>
                            โหลดรายงาน
                        </button>
                    </div>
                </div>
            </section>

            <section id="summary-cards" class="grid gap-4 md:grid-cols-2 xl:grid-cols-4"></section>
            <section id="loading-state" class="hidden space-y-4">
                <div class="glass-panel rounded-[2rem] p-6">
                    <div class="shimmer mb-5 h-8 w-56 rounded-2xl"></div>
                    <div class="grid gap-3 md:grid-cols-4">
                        <div class="shimmer h-24 rounded-3xl"></div>
                        <div class="shimmer h-24 rounded-3xl"></div>
                        <div class="shimmer h-24 rounded-3xl"></div>
                        <div class="shimmer h-24 rounded-3xl"></div>
                    </div>
                </div>
                <div class="glass-panel rounded-[2rem] p-6">
                    <div class="shimmer mb-4 h-7 w-72 rounded-2xl"></div>
                    <div class="shimmer h-[380px] rounded-[1.5rem]"></div>
                </div>
            </section>

            <section id="report-meta" class="hidden"></section>
            <section id="report-sections" class="space-y-6"></section>
        </div>
    </main>

    <script src="js/admin_backlog_summary.js"></script>
</body>

</html>
